<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новий руль. Більше драйву.</title>
  <meta name="description" content="Збір на ігровий руль. Ціль — 20 000 ₴. Долучайся!">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/banka/style.css?v=simple-2">
  <script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embedded');</script>
  <script src="/banka/config.js?v=mityplay-1" defer></script>
  <script src="/banka/script.js?v=mityplay-1" defer></script>
</head>
<body>
  <main>
    <section class="banner" aria-labelledby="heading">
      <h1 id="heading">Новий руль.<br>Більше <span>драйву.</span></h1>
    </section>
    <section class="widget" aria-label="Збір на руль">
      <div class="stats" aria-live="polite"><div><span>Вже зібрано</span><strong id="collected">—</strong></div><div><span>Ціль збору</span><strong id="goal">—</strong></div><div><span>Залишилось</span><strong id="remaining">—</strong></div></div>
      <div class="track" id="progress" role="progressbar" aria-label="Прогрес збору" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
      <div class="progress-caption"><span id="status">Завантажуємо дані банки…</span><span id="percent">—</span></div>
      <form id="donation" action="https://send.monobank.ua/jar/98Q3HB3o1D" method="get" target="_blank" rel="noopener noreferrer">
        <label for="amount">На скільки поповнимо?</label>
        <div class="presets"><button type="button" data-amount="50" aria-pressed="false">50 ₴</button><button type="button" data-amount="100" aria-pressed="true" class="selected">100 ₴</button><button type="button" data-amount="200" aria-pressed="false">200 ₴</button><button type="button" data-amount="500" aria-pressed="false">500 ₴</button></div>
        <div class="pay-row"><div class="input-wrap"><input id="amount" name="a" type="number" min="1" max="999999" step="0.01" value="100" required inputmode="decimal" aria-label="Сума поповнення у гривнях"><span>₴</span></div><button class="donate" type="submit">Поповнити банку <span>↗</span></button></div>
        <p class="note">Оплата на захищеній сторінці Monobank. Суму можна перевірити перед переказом.</p>
      </form>
    </section>
  </main>
</body>
</html>
